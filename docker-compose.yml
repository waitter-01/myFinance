services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: duxiu_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: change-this-db-password
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  ledger_pgdata:
